name: Portfolio sample checks

on:
  push:
    paths:
      - "samples/**"
      - "tests/**"
      - "docs/**"
      - "projects/**"
      - "assets/**"
      - "README*"
      - ".github/workflows/samples.yml"
  pull_request:

permissions:
  contents: read

jobs:
  public-quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install selected sample dependencies
        run: python -m pip install -r samples/evaluation/requirements.txt
      - name: Run Python code and publication checks
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test actual TypeScript date utilities
        run: node --experimental-strip-types --test tests/period.test.mjs
